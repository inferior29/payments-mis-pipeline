[project]
name = "payments-mis"
version = "0.1.0"
description = "Automated payments MIS reporting pipeline (synthetic data)"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
